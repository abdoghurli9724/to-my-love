<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غنيلي - تجربة سينمائية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05060a;
            --pink-accent: #f83292;
            --pink-glow: rgba(248, 50, 146, 0.6);
            --white-glow: rgba(255, 255, 255, 0.8);
            --gold: #ffcc00;
        }

        body, html {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100%;
        }

        /* --- حاوية الورد المتساقط (تظهر في المشهد 3 فقط) --- */
        #flowerContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; overflow: hidden; display: none;
        }
        .falling-flower-img {
            position: absolute;
            width: 30px;
            top: -50px;
            filter: drop-shadow(0 0 5px rgba(248, 50, 146, 0.3));
            animation: fallAndFade linear forwards;
        }
        @keyframes fallAndFade {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* واجهة الصانع */
        .maker-layout {
            max-width: 420px; margin: auto; padding: 20px;
            display: flex; flex-direction: column; justify-content: center; min-height: 100vh;
            position: relative; z-index: 100;
        }
        .step-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 35px;
            padding: 40px 25px; text-align: center;
        }
        .main-input {
            width: 100%; background: rgba(0,0,0,0.4); border: 2px solid var(--pink-accent);
            border-radius: 15px; padding: 15px; color: white; font-size: 18px;
            text-align: center; margin: 20px 0; outline: none;
        }
        .btn-action {
            width: 100%; border: none; padding: 18px; border-radius: 50px;
            color: white; font-size: 18px; font-weight: bold;
            background: linear-gradient(45deg, #9133a8, #f83292); cursor: pointer;
        }

        /* العرض السينمائي */
        #view-screen { 
            display: none; height: 100vh; width: 100%; 
            overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
        }
        #view-screen::-webkit-scrollbar { display: none; }

        section {
            height: 100vh; width: 100%; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            scroll-snap-align: start; text-align: center; overflow: hidden;
        }

        .big-name-text {
            font-family: 'Aref Ruqaa', serif; font-size: 60px;
            background: linear-gradient(to bottom, #fff, var(--pink-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            z-index: 10; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* المشهد 2: صورة العناق الكرتونية */
        .scene2-img {
            width: 320px; 
            border-radius: 25px; /* تدوير زوايا الصورة */
            filter: drop-shadow(0 0 40px rgba(248, 50, 146, 0.6)); /* توهج وردي دافئ */
            animation: floatAndPulse 3.5s infinite ease-in-out;
            z-index: 10;
        }

        /* المشهد 3: باقة الورد */
        .scene3-img {
            width: 280px;
            filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.5));
            animation: floatAndPulse 3s infinite ease-in-out;
            z-index: 10;
        }

        @keyframes floatAndPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* المشهد 4: النغمة الموسيقية */
        .visualizer {
            display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-bottom: 20px;
        }
        .bar {
            width: 12px; background: linear-gradient(to top, var(--pink-accent), var(--gold));
            border-radius: 6px; animation: wave 0.6s infinite alternate ease-in-out;
        }
        @keyframes wave { from { height: 20px; opacity: 0.5; } to { height: 120px; opacity: 1; } }

        /* النجوم */
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--speed) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        #start-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-dark);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="flowerContainer"></div>

<div class="maker-layout" id="maker-ui">
    <div class="step-card">
        <h2 style="font-family: 'Aref Ruqaa'; color: var(--gold); font-size: 32px;">غنيلي 🎵</h2>
        <div id="setup-step">
            <input type="text" id="nameInput" class="main-input" placeholder="اسم أغلى الناس...">
            <button class="btn-action" onclick="generateLink()">إنشاء الرابط السحري ✨</button>
        </div>
        <div id="result-step" style="display: none;">
            <p>جاهز للإرسال 💖</p>
            <div id="linkOutput" style="background:rgba(0,0,0,0.3); padding:12px; border-radius:15px; font-size:11px; margin-bottom: 20px; border:1px solid var(--pink-accent); word-break: break-all;"></div>
            <button class="btn-action" onclick="copyLink()">نسخ 📋</button>
        </div>
    </div>
</div>

<div id="start-overlay" style="display: none;">
    <div class="step-card" style="width: 290px;">
        <h2 id="greetName" style="font-family: 'Aref Ruqaa'; margin-bottom: 25px;"></h2>
        <button class="btn-action" onclick="initExperience()">فتح الإهداء 🎵</button>
    </div>
</div>

<div id="view-screen">
    <section id="scene1">
        <div class="big-name-text" id="finalName"></div>
        <p style="color: var(--gold); font-family: 'Aref Ruqaa'; font-size: 28px; margin-top: 10px;">يا حلم عمري...</p>
    </section>

    <section id="scene2">
        <img src="https://i.ibb.co/svDqxkxq/1000013084-removebg-preview.png" alt="حب" class="scene2-img">
        <div class="big-name-text" id="sceneName2" style="font-size: 42px; margin-top: 20px;"></div>
        <h2 style="font-family: 'Aref Ruqaa'; margin-top: 10px; z-index: 10;">بيحس بأمان معاك</h2>
    </section>

    <section id="scene3">
        <img src="https://i.ibb.co/tpp5Q7jS/1000013068-removebg-preview-1.png" alt="باقة ورد" class="scene3-img">
        <div class="big-name-text" id="sceneName3" style="font-size: 45px; margin-top: 20px;"></div>
        <h2 style="font-family: 'Aref Ruqaa'; color: var(--gold);">باقة حب لروحك</h2>
    </section>

    <section id="scene4">
        <div id="stars-scene4"></div>
        <div class="visualizer" id="viz"></div>
        <div class="big-name-text" id="sceneName4" style="font-size: 40px;"></div>
        <p style="font-family: 'Aref Ruqaa'; font-size: 22px;">أنت اللحن الذي يراقص قلبي</p>
    </section>

    <section id="scene5">
        <h2 class="big-name-text" style="font-size: 50px;">خليك معايا</h2>
        <div style="margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 25px;">
            <small style="opacity: 0.7;">بكل حب بواسطة</small><br>
            <strong style="color: var(--pink-accent); font-size: 24px;">عـبـدو غـرلي</strong>
        </div>
    </section>
</div>

<audio id="player" loop></audio>

<script>
    const songUrl = "https://f.top4top.io/m_3699yquuk0.mp3";
    const fallingRoseUrl = "https://i.ibb.co/HfM50fbn/1000013078-removebg-preview.png"; 

    let flowerInterval = null;

    function createStars(containerId) {
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = '';
        for(let i=0; i<45; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = (Math.random() * 2 + 1) + 'px';
            s.style.width = size; s.style.height = size;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.setProperty('--speed', (Math.random() * 3 + 2) + 's');
            container.appendChild(s);
        }
    }

    function startFlowerRain() {
        if (flowerInterval) return;
        const container = document.getElementById('flowerContainer');
        container.style.display = 'block';
        flowerInterval = setInterval(() => {
            const img = document.createElement('img');
            img.src = fallingRoseUrl;
            img.className = 'falling-flower-img';
            img.style.left = Math.random() * 100 + 'vw';
            const dur = Math.random() * 3 + 4;
            img.style.animationDuration = dur + 's';
            img.style.width = Math.random() * 20 + 20 + 'px';
            container.appendChild(img);
            setTimeout(() => img.remove(), dur * 1000);
        }, 400);
    }

    function stopFlowerRain() {
        const container = document.getElementById('flowerContainer');
        container.style.display = 'none';
        clearInterval(flowerInterval);
        flowerInterval = null;
        container.innerHTML = '';
    }

    function generateLink() {
        const name = document.getElementById('nameInput').value;
        if (!name) return alert("اكتب الاسم أولاً");
        const link = window.location.href.split('?')[0] + "?to=" + encodeURIComponent(name);
        document.getElementById('setup-step').style.display = 'none';
        document.getElementById('result-step').style.display = 'block';
        document.getElementById('linkOutput').innerText = link;
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById('linkOutput').innerText);
        alert("تم نسخ الرابط بنجاح 💖");
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('to')) {
            const name = decodeURIComponent(params.get('to'));
            document.getElementById('maker-ui').style.display = 'none';
            document.getElementById('start-overlay').style.display = 'flex';
            document.getElementById('greetName').innerText = "إلى " + name;
            
            document.getElementById('finalName').innerText = name;
            document.getElementById('sceneName2').innerText = name;
            document.getElementById('sceneName3').innerText = name;
            document.getElementById('sceneName4').innerText = name;

            createStars('stars-scene4');

            const viz = document.getElementById('viz');
            for(let i=0; i<12; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.animationDelay = (i * 0.1) + 's';
                viz.appendChild(bar);
            }
        }
    };

    function initExperience() {
        document.getElementById('start-overlay').style.display = 'none';
        const viewScreen = document.getElementById('view-screen');
        viewScreen.style.display = 'block';
        const audio = document.getElementById('player');
        audio.src = songUrl;
        audio.play();

        const sections = document.querySelectorAll('section');
        let current = 0;

        setInterval(() => {
            current = (current + 1) % sections.length;
            sections[current].scrollIntoView({ behavior: 'smooth' });

            // تفعيل المطر فقط في المشهد الثالث (الذي ترتيبه 2 في البرمجة)
            if (current === 2) {
                startFlowerRain();
            } else {
                stopFlowerRain();
            }
        }, 8000);
    }
</script>
</body>
</html>
